<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Produto</title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="../style/cadastro_produto.css">

    <!-- Ícone -->
    <link
        rel="icon"
        type="image/png"
        href="../assets/logo.png">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!--=========================================
                CÍRCULOS DECORATIVOS
    ==========================================-->

    <div class="background-circles">

        <span class="circle circle1"></span>
        <span class="circle circle2"></span>
        <span class="circle circle3"></span>
        <span class="circle circle4"></span>
        <span class="circle circle5"></span>
        <span class="circle circle6"></span>

    </div>

    <!--=========================================
                CONTAINER PRINCIPAL
    ==========================================-->

    <main class="cadastro-container">

        <!--=========================================
                    CABEÇALHO
        ==========================================-->

        <header class="page-header">

            <h1 id="tituloPagina"></h1>

            <p id="descricaoPagina"></p>

        </header>

        <!--=========================================
                    ETAPAS
        ==========================================-->

        <section class="steps">

            <div class="step active">

                <div class="step-number">
                    1
                </div>

                <span>Informações</span>

            </div>

            <div class="step-line"></div>

            <div class="step">

                <div class="step-number">
                    2
                </div>

                <span>Vídeo</span>

            </div>

            <div class="step-line"></div>

            <div class="step">

                <div class="step-number">
                    3
                </div>

                <span>Thumbnail</span>

            </div>

            <div class="step-line"></div>

            <div class="step">

                <div class="step-number">
                    4
                </div>

                <span>Publicação</span>

            </div>

        </section>

        <!--=========================================
                    FORMULÁRIO
        ==========================================-->

        <form id="formCadastro">

            <!--=========================================
                    INFORMAÇÕES DO PRODUTO
            ==========================================-->

            <section class="card">

                <div class="section-title">

                    <h2 id="tituloInformacoes"></h2>

                    <p id="descricaoInformacoes"></p>

                </div>

                <div class="grid-2">

                    <!-- Nome do Produto -->

                    <div class="input-group">

                        <label
                            id="lblTitulo"
                            for="nome">
                        </label>

                        <input
                            type="text"
                            id="nome"
                            maxlength="100"
                            required>

                    </div>

                </div>

                <!-- Descrição -->

                <div class="input-group">

                    <label
                        id="lblDescricao"
                        for="descricao">
                    </label>

                    <textarea
                        id="descricao"
                        rows="6"
                        maxlength="1000"
                        required>
                    </textarea>

                </div>

                <!-- Mensagem -->

                <div
                    id="mensagem"
                    class="mensagem">
                </div>

            </section>


                        <!--=========================================
                        VÍDEO
            ==========================================-->

            <section class="card">

                <div class="section-title">

                    <h2 id="tituloVideo"></h2>

                    <p id="descricaoVideo"></p>

                </div>

                <div class="grid-2">

                    <!-- Nível -->

                    <div class="input-group">

                        <label
                            id="lblNivel"
                            for="nivel">
                        </label>

                        <select
                            id="nivel"
                            required>

                            <option value="">
                                Selecione um nível
                            </option>

                            <option value="1">
                                Básico
                            </option>

                            <option value="2">
                                Intermediário
                            </option>

                            <option value="3">
                                Avançado
                            </option>

                        </select>

                    </div>

                    <!-- Categoria -->

                    <div class="input-group">

                        <label
                            id="lblCategoria"
                            for="categoria">
                        </label>

                        <select
                            id="categoria"
                            required>

                            <option value="">
                                Selecione uma categoria
                            </option>

                            <option value="pronuncia">
                                Pronúncia
                            </option>

                            <option value="vocabulario">
                                Vocabulário
                            </option>

                            <option value="gramatica">
                                Gramática
                            </option>

                            <option value="exterior_trabalho">
                                Exterior - Trabalho
                            </option>

                            <option value="exterior_travel">
                                Exterior - Travel
                            </option>

                        </select>

                    </div>

                </div>

                <!-- Link do vídeo -->

                <div class="input-group">

                    <label
                        id="lblYoutube"
                        for="youtube">
                    </label>

                    <input
                        type="url"
                        id="youtube"
                        placeholder="https://www.youtube.com/watch?v=..."
                        required>

                </div>

            </section>


                        <!--=========================================
                        THUMBNAIL
            ==========================================-->

            <section class="card">

                <div class="section-title">

                    <h2 id="tituloThumbnail"></h2>

                    <p id="descricaoThumbnail"></p>

                </div>

                <div class="grid-2">

                    <!-- Upload da Thumbnail -->

                    <div class="upload-box">

                        <label
                            id="lblThumbnail"
                            for="thumbnail">
                        </label>

                        <input
                            type="file"
                            id="thumbnail"
                            accept="image/*">

                    </div>

                    <!-- Preview da Thumbnail -->

                    <div
                        class="thumbnail-preview"
                        id="previewThumbnail">

                        <i class="fa-regular fa-image"></i>

                        <p id="textoPreviewThumbnail"></p>

                    </div>

                </div>

            </section>

            <!--=========================================
                        BOTÕES
            ==========================================-->

            <section class="buttons">

                <button
                    type="button"
                    id="btnVisualizar">
                </button>

                <button
                    type="button"
                    id="btnRascunho">
                </button>

                <button
                    type="submit"
                    id="btnPublicar">
                </button>

            </section>

        </form>

    </main>

    <!--=========================================
                JAVASCRIPT
    ==========================================-->

    <script src="../js/cadastro_produto.js"></script>

</body>

</html>
