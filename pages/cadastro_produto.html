<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Produto</title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="../style/cadastro_produto.css">

    <!-- Ícone -->
    <link
        rel="icon"
        type="image/png"
        href="../assets/logo.png">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!--=========================================
                CÍRCULOS DECORATIVOS
    ==========================================-->

    <div class="background-circles">

        <span class="circle circle1"></span>
        <span class="circle circle2"></span>
        <span class="circle circle3"></span>
        <span class="circle circle4"></span>
        <span class="circle circle5"></span>
        <span class="circle circle6"></span>

    </div>

    <!--=========================================
                CONTAINER PRINCIPAL
    ==========================================-->

    <main class="cadastro-container">

        <!--=========================================
                    CABEÇALHO
        ==========================================-->

        <header class="page-header">

            <h1 id="tituloPagina"></h1>

            <p id="descricaoPagina"></p>

        </header>

        <!--=========================================
                    ETAPAS
        ==========================================-->

        <section class="steps">

            <div class="step active">

                <div class="step-number">
                    1
                </div>

                <span>Informações</span>

            </div>

            <div class="step-line"></div>

            <div class="step">

                <div class="step-number">
                    2
                </div>

                <span>Vídeo</span>

            </div>

            <div class="step-line"></div>

            <div class="step">

                <div class="step-number">
                    3
                </div>

                <span>Capa</span>

            </div>

            <div class="step-line"></div>

            <div class="step">

                <div class="step-number">
                    4
                </div>

                <span>Publicação</span>

            </div>

        </section>

        <!--=========================================
                    FORMULÁRIO
        ==========================================-->

        <form id="formCadastro">

                        <!--=========================================
                        INFORMAÇÕES
            ==========================================-->

            <section class="card">

                <div class="section-title">

                    <h2 id="tituloInformacoes"></h2>

                    <p id="descricaoInformacoes"></p>

                </div>

                <div class="grid-2">

                    <!-- TÍTULO -->

                    <div class="input-group">

                        <label
                            id="lblTitulo"
                            for="nome">
                        </label>

                        <input
                            type="text"
                            id="nome"
                            required>

                    </div>

                </div>

                <!-- DESCRIÇÃO -->

                <div class="input-group">

                    <label
                        id="lblDescricao"
                        for="descricao">
                    </label>

                    <textarea
                        id="descricao"
                        rows="6"
                        required>
                    </textarea>

                </div>

                <!-- MENSAGEM -->

                <div
                    id="mensagem"
                    class="mensagem">
                </div>

            </section>



                        <!--=========================================
                        VÍDEO
            ==========================================-->

            <section class="card">

                <div class="section-title">

                    <h2 id="tituloVideo"></h2>

                    <p id="descricaoVideo"></p>

                </div>

                <div class="grid-2">

                    <!-- Upload do vídeo -->

                    <div class="upload-box">

                        <label
                            id="lblUploadVideo"
                            for="arquivoVideo">
                        </label>

                        <input
                            type="file"
                            id="arquivoVideo"
                            accept="video/*">

                        <div
                            class="preview-video"
                            id="previewVideo">

                            <i class="fa-solid fa-video"></i>

                            <p id="textoPreviewVideo"></p>

                        </div>

                    </div>

                    <!-- Link do YouTube -->

                    <div class="input-group">

                        <label
                            id="lblYoutube"
                            for="youtube">
                        </label>

                        <input
                            type="url"
                            id="youtube">

                    </div>

                </div>

            </section>

                        <!--=========================================
                        CAPA (THUMBNAIL)
            ==========================================-->

            <section class="card">

                <div class="section-title">

                    <h2 id="tituloThumbnail"></h2>

                    <p id="descricaoThumbnail"></p>

                </div>

                <div class="grid-2">

                    <!-- Upload da Thumbnail -->

                    <div class="upload-box">

                        <label
                            id="lblThumbnail"
                            for="thumbnail">
                        </label>

                        <input
                            type="file"
                            id="thumbnail"
                            accept="image/*">

                    </div>

                    <!-- Preview da Thumbnail -->

                    <div
                        class="thumbnail-preview"
                        id="previewThumbnail">

                        <i class="fa-regular fa-image"></i>

                        <p id="textoPreviewThumbnail"></p>

                    </div>

                </div>

            </section>

                        <!--=========================================
                    CONFIGURAÇÕES
            ==========================================-->

            <section class="card">

                <div class="section-title">

                    <h2 id="tituloConfiguracoes"></h2>

                    <p id="descricaoConfiguracoes"></p>

                </div>

                <div class="grid-2">

                    <!-- Duração -->

                    <div class="input-group">

                        <label
                            id="lblDuracao"
                            for="duracao">
                        </label>

                        <input
                            type="text"
                            id="duracao">

                    </div>

                    <!-- Ordem -->

                    <div class="input-group">

                        <label
                            id="lblOrdem"
                            for="ordem">
                        </label>

                        <input
                            type="number"
                            id="ordem"
                            min="1">

                    </div>

                    <!-- Status -->

                    <div class="input-group">

                        <label
                            id="lblStatus"
                            for="status">
                        </label>

                        <select id="status">

                            <option value="">Selecione</option>
                            <option value="Ativo">Ativo</option>
                            <option value="Inativo">Inativo</option>

                        </select>

                    </div>

                    <!-- Visibilidade -->

                    <div class="input-group">

                        <label
                            id="lblVisibilidade"
                            for="visibilidade">
                        </label>

                        <select id="visibilidade">

                            <option value="">Selecione</option>
                            <option value="Publico">Público</option>
                            <option value="Privado">Privado</option>

                        </select>

                    </div>

                </div>

            </section>

            <!--=========================================
                        BOTÕES
            ==========================================-->

            <section class="buttons">

                <button
                    type="button"
                    id="btnVisualizar">
                </button>

                <button
                    type="button"
                    id="btnRascunho">
                </button>

                <button
                    type="submit"
                    id="btnPublicar">
                </button>

            </section>

        </form>

    </main>

    <!--=========================================
                JAVASCRIPT
    ==========================================-->

    <script src="../js/cadastro_produto.js"></script>

</body>

</html>
