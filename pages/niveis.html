<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Níveis </title>

    <link rel="stylesheet" href="/style/niveis.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

 




    <!-- CABEÇALHO -->
    <header>
    <div class="topo">
      <!-- Logo do site -->
      <div class="logo">
        <img src="/assets/logo.png" alt="Logo do BEE INGLES">
      </div>
      <!-- CAIXAS DE PESQUISA -->
      <div class="caixa-de-pesquisa">
        <input type="text" placeholder="what would you like to learn today?">
        <img src="/assets/lupa 128.png" alt="Lupa de pesquisa">
      </div>
      <!-- -->
      <div class="icones">
        <a href="">
          <img src="/assets/user.png" alt="login">
          <small>Olá aluno(a)</small>
          <p>ENTRAR</p>
        </a>
        <a href="">
          <img src="/assets/notificacao pixel.png" alt="notification">
          <p>NOTIFICAÇÃO</p>
        </a>
      </div>
    </div>


    <!-- Menu de navegação -->
    <nav class="menu">
      <a href="#" id="idhome">Home</a>

    <a href="#" id="idnivel">Nível</a>

    <a href="#" id="idblog">Blog</a>

    <a href="#" id="idtopicos">Tópicos</a>

    <a href="#" id="idexercicios">Exercícios</a>

    <a href="#" id="idteste">Teste de Nível</a>

    </nav>
  </header>


    <main>
<!-- ===========================
            FUNDO ANIMADO
    ============================ -->

    <div id="background-circles">

        
    </div>
        <!-- BÁSICO -->
        <section class="nivel" id="basico">

     <div class="titulo">
        <h2>BÁSICO</h2>
     </div>

     <div class="cards" id="cardsBasico">
     </div>

      </section>

        <!-- MÉDIO -->
        <section class="nivel" id="intermediario">

    <div class="titulo">
        <h2>INTERMEDIÁRIO</h2>
    </div>

    <div class="cards" id="cardsIntermediario">
    </div>

     </section>



        <!-- DIFÍCIL -->
       <section class="nivel" id="avancado">

    <div class="titulo">
        <h2>AVANÇADO</h2>
    </div>

    <div class="cards" id="cardsAvancado">
    </div>

</section>
   
</main>

    <!-- MODAL -->
    <div class="modal" id="videoModal">

    <div class="modal-content">

        <button
            class="close"
            aria-label="Fechar vídeo">

            &times;

        </button>

        <h2 id="modalTitulo"></h2>

        <div class="video-area">

            <h3>Vídeo em Inglês</h3>

            <video
                id="videoPlayerIngles"
                controls
                preload="metadata"
                controlsList="nodownload">

            </video>

        </div>

        <div
            class="explicacao-area"
            id="explicacaoArea">

            <h3>Explicação em Português</h3>

            <video
                id="videoPlayerPortugues"
                controls
                preload="metadata"
                controlsList="nodownload">

            </video>

        </div>

    </div>

</div>

    <footer class="footer">

    <div class="footer-container">
      

        <div class="footer-logo">
            <h2>BEE<br>INGLÊS</h2>
           
        </div>

        <div class="footer-links">

            <div class="social-item">
                <div>
                    <span>WHATSAPP</span>
                    <p>(63) 9302-3352</p>
                </div>
                <i class><img src= "/assets/whatsapp.png"></i>
            </div>

            <div class="social-item">
                <div>
                    <span>INSTAGRAM</span>
                    <p>@BEEINGLES</p>
                </div>
                <i class><img src="/assets/instagram.png"></i>
            </div>

            <div class="social-item">
                <div>
                    <span>G-MAIL</span>
                    <p>DFG@MAIL</p>
                </div>
                <i class><img src="/assets/mail.png"></i>
            </div>

        </div>

    </div>

    <div class="footer-bottom">

        <p>© BEE INGLÊS</p>

        <p>POLITICA DE PRIVACIDADE</p>

        <p>TERMOS DE USO</p>

    </div>

</footer>

    <script src="../js/niveis.js"></script>

</body>

</html>
