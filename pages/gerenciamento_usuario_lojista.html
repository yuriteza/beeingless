<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciamento de Usuários</title>

    <link rel="stylesheet" href="../style/gerenciamento_usuario_lojista.css">

    <link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <!--IMAGEM DA LOGO P/ NAVEGADOR-->
  <link rel="icon" type="image/png" href="/assets/logo.png">

</head>

<body>

    <!--====================================
                FUNDO ANIMADO
    =====================================-->

    <div id="background-circles"></div>

    <!--====================================
                CONTEÚDO
    =====================================-->

    <main class="container">

        <section class="page-header">

            <h1 id="tituloPagina"></h1>

            <p id="subtituloPagina"></p>

        </section>

        <section class="card">

            <div class="barra-superior">

                <input
                    type="text"
                    id="pesquisa"
                    placeholder="Pesquisar usuário...">

                <select id="filtroStatus">

                </select>

                <button id="btnPesquisar"></button>

            </div>

            <div class="table-responsive">

                <table>

                    <thead>

                        <tr>

                            <th>Foto</th>

                            <th>Nome</th>

                            <th>E-mail</th>

                            <th>Telefone</th>

                            <th>Status</th>

                            <th>Ações</th>

                        </tr>

                    </thead>

                    <tbody id="listaUsuarios">

                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="../js/gerenciamento_usuario_lojista.js"></script>

</body>

</html>
