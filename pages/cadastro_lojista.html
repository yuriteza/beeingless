<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro do Lojista</title>

    <link
        rel="icon"
        type="image/png"
        href="/assets/logo.png"
    >

    <link
        rel="stylesheet"
        href="../style/cadastro_lojista.css"
    >

    <!-- Font Saira -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/Saira/6.7.2/css/all.min.css"
    >

</head>

<body>

    <!-- ===========================
            FUNDO ANIMADO
    ============================ -->

    <div id="background-circles"></div>


    <!-- ===========================
            CONTAINER
    ============================ -->

    <main id="cadastro-container">

        <!-- ===========================
                CABEÇALHO
        ============================ -->

        <header id="cabecalho">

            <h1 id="titulo"></h1>

            <p id="subtitulo"></p>

        </header>


        <!-- ===========================
                CARD
        ============================ -->

        <section id="card-cadastro">

            <form
                id="formCadastro"
                autocomplete="off"
            >

                <div id="grid-formulario">


                    <!-- =====================
                            NOME
                    ====================== -->

                    <div class="campo">

                        <label
                            id="lblNome"
                            for="nome"
                        ></label>

                        <input
                            id="nome"
                            type="text"
                        >

                        <small id="erroNome"></small>

                    </div>


                    <!-- =====================
                            EMAIL
                    ====================== -->

                    <div class="campo">

                        <label
                            id="lblEmail"
                            for="email"
                        ></label>

                        <input
                            id="email"
                            type="email"
                        >

                        <small id="erroEmail"></small>

                    </div>


                    <!-- =====================
                            CPF
                    ====================== -->

                    <div class="campo">

                        <label
                            id="lblCpf"
                            for="cpf"
                        ></label>

                        <input
                            id="cpf"
                            type="text"
                            maxlength="14"
                        >

                        <small id="erroCpf"></small>

                    </div>


                    <!-- =====================
                            SENHA
                    ====================== -->

                    <div class="campo">

                        <label
                            id="lblSenha"
                            for="senha"
                        ></label>

                        <div class="senha-box">

                            <input
                                id="senha"
                                type="password"
                            >

                            <button
                                id="btnSenha"
                                type="button"
                            >

                                <i class="fa-solid fa-eye"></i>

                            </button>

                        </div>

                        <small id="erroSenha"></small>

                    </div>


                    <!-- =====================
                            CNPJ
                    ====================== -->

                    <div class="campo">

                        <label
                            id="lblCnpj"
                            for="cnpj"
                        ></label>

                        <input
                            id="cnpj"
                            type="text"
                            maxlength="18"
                        >

                        <small id="erroCnpj"></small>

                    </div>


                    <!-- =====================
                            TELEFONE
                    ====================== -->

                    <div class="campo">

                        <label
                            id="lblTelefone"
                            for="telefone"
                        ></label>

                        <input
                            id="telefone"
                            type="text"
                            maxlength="15"
                        >

                        <small id="erroTelefone"></small>

                    </div>

                </div>


                <!-- ===========================
                        BOTÕES
                ============================ -->

                <div id="botoes">

                    <button
                        id="btnCadastrar"
                        type="submit"
                    ></button>

                    <button
                        id="btnLimpar"
                        type="reset"
                    ></button>

                </div>

            </form>

        </section>

    </main>


    <!-- ===========================
            JAVASCRIPT
    ============================ -->

    <script src="../js/cadastro_lojista.js"></script>

</body>

</html>
