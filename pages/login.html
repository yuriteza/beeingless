<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title id="Login "></title>

    <link rel="stylesheet" href="/style/login.css">

</head>

<body>

    <!-- ==========================
         HEADER
    =========================== -->

    <header id="header">



    </header>


    <!-- ==========================
         MAIN
    =========================== -->

    <main>

        <section class="auth-container" id="authContainer">

            <!-- ======================
                 LOGIN
            ======================= -->

            <section class="form-panel login-panel" id="loginPanel">

                <form id="loginForm" autocomplete="off">

                    <h1 id="loginTitle"></h1>

                    <p id="loginSubtitle"></p>

                    <!-- Email -->

                    <div class="form-group">

                        <label id="loginEmailLabel" for="loginEmail">
                        </label>

                        <input id="loginEmail" type="email">

                    </div>

                    <!-- Senha -->

                    <div class="form-group">

                        <label id="loginPasswordLabel" for="loginPassword">
                        </label>

                        <input id="loginPassword" type="password">

                    </div>

                    <!-- Esqueci -->

                    <div class="forgot-area">

                        <a href="#" id="forgotPassword">
                        </a>

                    </div>

                    <!-- Botão -->

                    <button id="loginButton" type="button">
                    </button>

                    <div id="mensagemLogin"></div>

                    <!-- Separador -->

                    <div class="separator">

                        <span id="separatorText"></span>

                    </div>

                    <!-- Google -->

                    <button id="googleButton" type="button">

                        <img src="/assets/google.png " alt="Google">

                        <span id="googleText"></span>

                    </button>

                </form>

            </section>

            <!-- ======================
                 CADASTRO
            ======================= -->

            <section class="form-panel register-panel" id="registerPanel">

                <form id="registerForm" autocomplete="off">

                    <h1 id="registerTitle"></h1>

                    <p id="registerSubtitle"></p>

                    <!-- Nome -->

                    <div class="form-group">

                        <label id="registerNameLabel" for="registerName">
                        </label>

                        <input id="registerName" type="text">

                    </div>

                    <!-- Email -->

                    <div class="form-group">

                        <label id="registerEmailLabel" for="registerEmail">
                        </label>

                        <input id="registerEmail" type="email">

                    </div>

                    <!-- Telefone -->

                      <div class="form-group">

                        <label id="registerPhoneLabel" for="registerPhone">
                            Telefone
                        </label>

                         <input
                                id="registerPhone"
                                type="tel"
                                placeholder="(00) 00000-0000"
                                maxlength="15"
                                autocomplete="off"
                            >
                    </div>
                    <!-- Senha -->

                    <div class="form-group">

                        <label id="registerPasswordLabel" for="registerPassword">
                        </label>

                        <input id="registerPassword" type="password">

                    </div>


                  

                    <!-- Confirmar Senha -->

                    <div class="form-group">

                        <label id="confirmPasswordLabel" for="confirmPassword">
                        </label>

                        <input id="confirmPassword" type="password">

                    </div>

                    <!-- Botão -->

                    <button id="registerButton" type="submit">
                       
                    </button>

                   <div id="mensagemCadastro"></div>

                </form>

            </section>

            <!-- =====================================
                    PAINEL DESLIZANTE
            ====================================== -->

            <section class="overlay-container" id="overlayContainer">

                <div class="overlay" id="overlay">

                    <!-- =========================
                            PAINEL ESQUERDO
                    ========================== -->

                    <div class="overlay-panel overlay-left" id="overlayLeft">



                        <h1 id="leftTitle"></h1>

                        <p id="leftDescription"></p>

                        <button id="goLogin" type="button">
                        </button>

                    </div>

                    <!-- =========================
                            PAINEL DIREITO
                    ========================== -->

                    <div class="overlay-panel overlay-right" id="overlayRight">


                        <h1 id="rightTitle"></h1>

                        <p id="rightDescription"></p>

                        <button id="goRegister" type="button">
                        </button>

                    </div>

                </div>

            </section>

        </section>

    </main>

    <!-- ==========================
            FOOTER
    =========================== -->

    <footer id="footer">

        <span id="footerText"></span>

    </footer>

    <!-- ==========================
            JAVASCRIPT
    =========================== -->

    <script src="/js/login.js"></script>

</body>

</html>
